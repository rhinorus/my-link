spring:
  datasource:
    url:  jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:mylink}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: true
    open-in-view: false
    defer-datasource-initialization: false
    
  web:
    resources:
      cache:
        period: 7d

spring.application.name: mylink

# https reverse proxy support
server:
  forward-headers-strategy: framework
  compression:
    enabled: true

oauth0:
  service-base-url: ${SERVICE_BASE_URL}
  oauth-base-url: https://oauth0.site
  description: Легко запомнить. Легко поделиться.
  service-name: Моя-ссылка.рф